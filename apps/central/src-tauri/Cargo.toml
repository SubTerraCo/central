[package]
name = "central"
version = "0.1.0"
edition = "2021"
description = "Central desktop and mobile shell"

[lib]
name = "central_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
